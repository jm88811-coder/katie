<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>02 Words + symbol, dissolving into dots</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); font-weight: 800; }
        #s02-words {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Pretendard", sans-serif;
          color: #f4f4f0;
        }
        #s02-line {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 46px;
        }
        .s02-w {
          display: block;
          font-weight: 800;
          font-size: 150px;
          line-height: 1.1;
          letter-spacing: -0.02em;
          white-space: nowrap;
        }
        #s02-symbox {
          position: relative;
          width: 150px;
          height: 150px;
          margin-left: 34px;
          flex: none;
        }
        #s02-halo {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 520px;
          height: 520px;
          margin: -260px 0 0 -260px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(200, 255, 0, 0.45) 0%, rgba(200, 255, 0, 0.12) 40%, rgba(200, 255, 0, 0) 70%);
        }
        #s02-dots {
          position: absolute;
          inset: 0;
        }
        .s02-d {
          position: absolute;
          left: 0;
          top: 0;
          border-radius: 50%;
        }
        .s02-d.l {
          background: #c8ff00;
          box-shadow: 0 0 8px rgba(200, 255, 0, 0.9);
        }
        .s02-d.p {
          background: #f4f4f0;
        }
      </style>

      <div data-hf-id="hf-pt6m" id="s02-words" data-composition-id="s02-words" data-width="1920" data-height="1080" data-duration="3.25" data-fps="60">
        <div data-hf-id="hf-exk5" id="s02-line">
          <span data-hf-id="hf-mopr" class="s02-w" id="s02-w0">대본</span>
          <span data-hf-id="hf-axfa" class="s02-w" id="s02-w1">디자인</span>
          <span data-hf-id="hf-l0ov" class="s02-w" id="s02-w2">영상</span>
          <div data-hf-id="hf-7vfj" id="s02-symbox"><div data-hf-id="hf-f2b0" id="s02-halo" data-layout-allow-overflow=""></div></div>
        </div>
        <div data-hf-id="hf-54ya" id="s02-dots" data-layout-allow-overflow=""></div>
      </div>

      <script>
        (function () {
          const K = window.MinoKit;
          const symbox = document.getElementById("s02-symbox");
          symbox.insertAdjacentHTML("beforeend", K.symbolHTML("s02-sym"));
          const dotsLayer = document.getElementById("s02-dots");

          const build = () => {
            const tl = gsap.timeline({ paused: true });
            const words = ["#s02-w0", "#s02-w1", "#s02-w2"].map((s) => document.querySelector(s));
            const sym = document.getElementById("s02-sym");

            // Sample ink points on an invisible copy (this scene is not laid out yet at build time).
            const ids = ["s02-w0", "s02-w1", "s02-w2", "s02-sym"];
            const targets = [
              { el: words[0], n: 120, seed: 11 },
              { el: words[1], n: 170, seed: 23 },
              { el: words[2], n: 120, seed: 37 },
              { el: sym, n: 110, seed: 51 },
            ];
            const measured = K.measure("s02-words", (c) =>
              ids.map((id, i) => {
                const el = c.querySelector("#" + id);
                const r = el.getBoundingClientRect();
                return { pts: K.inkPoints(el, c, targets[i].n, targets[i].seed), center: [r.left + r.width / 2, r.top + r.height / 2] };
              })
            );
            const samples = measured.map((m) => m.pts);
            const centers = measured.map((m) => m.center);
            // The symbol has turned by the time it dissolves (see its rotation tween below):
            // rotate its sampled points to match.
            const symAngle = ((-10 + 50 * ((1.3 + 3 * 0.2 - 0.9) / 1.4)) * Math.PI) / 180;
            samples[3].forEach((p) => {
              const dx = p.x - centers[3][0];
              const dy = p.y - centers[3][1];
              p.x = centers[3][0] + dx * Math.cos(symAngle) - dy * Math.sin(symAngle);
              p.y = centers[3][1] + dx * Math.sin(symAngle) + dy * Math.cos(symAngle);
            });

            // Words arrive left to right, 0.3s apart: up from below, blur clearing.
            words.forEach((w, i) => {
              tl.fromTo(w, { y: 70, opacity: i === 0 ? 0.25 : 0, filter: "blur(14px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, i * 0.3);
            });

            // The sentence lands; the symbol rises on the right with a lime glow and turns slowly.
            tl.fromTo("#s02-symbox", { y: 40, scale: 0.5, opacity: 0, filter: "blur(10px)" }, { y: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "back.out(2)" }, 0.9);
            tl.fromTo("#s02-halo", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 0.9);
            tl.fromTo("#s02-sym", { rotation: -10 }, { rotation: 40, duration: 1.4, ease: "none" }, 0.9);

            // No hold: dissolve left -> right. Dots appear on the ink first, then the ink goes,
            // then the dots scatter. The last dot fades out exactly at 3.0s.
            const T0 = 1.3;
            const LAST = 3.0;
            targets.forEach((t, i) => {
              const at = T0 + i * 0.2;
              const pts = samples[i];
              const c = centers[i];
              pts.forEach((p, j) => {
                const d = document.createElement("i");
                const lime = p.rand() < 0.55;
                d.className = "s02-d " + (lime ? "l" : "p");
                const size = 4 + Math.floor(p.rand() * 6);
                d.style.width = d.style.height = size + "px";
                dotsLayer.appendChild(d);
                const x0 = p.x - size / 2;
                const y0 = p.y - size / 2;
                const appear = at + p.u * 0.14;
                let ang = Math.atan2(p.y - c[1], p.x - c[0]) + (p.rand() - 0.5) * 1.6;
                const dist = 160 + p.rand() * 460;
                const isLast = i === targets.length - 1;
                let end = isLast ? LAST - p.rand() * 0.35 : appear + 0.75 + p.rand() * 0.45;
                if (isLast && j === 0) end = LAST;
                end = Math.min(end, LAST);
                tl.fromTo(d, { x: x0, y: y0, scale: 0, opacity: 1 }, { scale: 1, duration: 0.08, ease: "power2.out" }, appear);
                tl.to(d, { x: x0 + Math.cos(ang) * dist, y: y0 + Math.sin(ang) * dist, duration: end - (appear + 0.1), ease: "power2.out" }, appear + 0.1);
                tl.to(d, { opacity: 0, duration: (end - (appear + 0.1)) * 0.7, ease: "power1.in" }, appear + 0.1 + (end - (appear + 0.1)) * 0.3);
              });
              // The element is erased behind the dot sweep.
              tl.fromTo(t.el, { clipPath: "inset(-20% -20% -20% 0%)" }, { clipPath: "inset(-20% -20% -20% 140%)", duration: 0.16, ease: "none" }, at + 0.06);
              if (i === targets.length - 1) tl.to("#s02-halo", { opacity: 0, duration: 0.25 }, at + 0.06);
            });
            tl.set({}, {}, 3.25);
            window.__timelines["s02-words"] = tl;
          };
          K.fontsReady().then(build);
        })();
      </script>
    </template>
  </body>
</html>
