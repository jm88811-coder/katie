<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>01 Logo assembly</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); font-weight: 800; }
        #s01-logo {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Pretendard", sans-serif;
        }
        #s01-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 210px;
        }
        #s01-stage .logo-sym {
          position: relative;
        }
        #s01-dot {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 22px;
          height: 22px;
          margin: -11px 0 0 -11px;
          border-radius: 50%;
          background: #c8ff00;
          box-shadow: 0 0 16px rgba(200, 255, 0, 1), 0 0 48px rgba(200, 255, 0, 0.6);
        }
        #s01-ring {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 220px;
          height: 220px;
          margin: -110px 0 0 -110px;
          border-radius: 50%;
          border: 3px solid #c8ff00;
          box-shadow: 0 0 24px rgba(200, 255, 0, 0.8);
          opacity: 0;
        }
      </style>

      <div data-hf-id="hf-o0nh" id="s01-logo" data-composition-id="s01-logo" data-width="1920" data-height="1080" data-duration="3" data-fps="60">
        <div data-hf-id="hf-scyw" id="s01-stage"></div>
      </div>

      <script>
        (function () {
          const K = window.MinoKit;
          const stage = document.getElementById("s01-stage");
          stage.innerHTML = K.logoHTML("lg1");
          const symBox = stage.querySelector(".logo-sym");
          symBox.insertAdjacentHTML("beforeend", '<div id="s01-ring"></div><div id="s01-dot"></div>');
          document.getElementById("lg1-sym-a").setAttribute("data-hf-motion-blur", '{"fps": 60}');
          document.getElementById("lg1-sym-b").setAttribute("data-hf-motion-blur", '{"fps": 60}');

          const build = () => {
            const tl = gsap.timeline({ paused: true });
            // Start with the symbol at screen centre; the lockup slides left as the letters arrive.
            const dx = K.measure("s01-logo", (c) => {
              const r = c.querySelector(".logo-sym").getBoundingClientRect();
              return 960 - (r.left + r.width / 2);
            });
            const logo = document.getElementById("lg1-logo");

            tl.fromTo(logo, { x: dx }, { x: 0, duration: 0.45, ease: "power3.inOut" }, 0.85);

            // A single point.
            tl.fromTo("#s01-dot", { scale: 0.35, opacity: 0.7 }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(3)" }, 0);
            tl.to("#s01-dot", { scale: 1.5, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.25);

            // Two pieces fly in and lock together on the point.
            tl.fromTo("#lg1-sym-a", { x: -760, y: 120, rotation: -140, opacity: 0 }, { x: 0, y: 0, rotation: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.3);
            tl.fromTo("#lg1-sym-b", { x: 760, y: -120, rotation: 140, opacity: 0 }, { x: 0, y: 0, rotation: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.3);
            tl.to("#s01-dot", { scale: 0, opacity: 0, duration: 0.12 }, 0.72);
            tl.fromTo("#s01-ring", { scale: 0.4, opacity: 1 }, { scale: 2.1, opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, 0.74);
            tl.fromTo(symBox, { scale: 1.12 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, 0.74);

            // Wordmark builds letter by letter: up from below, blur clearing.
            ["#lg1-l0", "#lg1-l1", "#lg1-l2", "#lg1-l3"].forEach((sel, i) => {
              tl.fromTo(sel, { y: 90, opacity: 0, filter: "blur(14px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 0.95 + i * 0.09);
            });

            // AI badge pop.
            tl.fromTo("#lg1-ai", { scale: 0, rotation: -24, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.35, ease: "back.out(3)" }, 1.5);

            // Settled: the symbol keeps turning, very slowly; the lockup breathes in.
            tl.fromTo("#lg1-sym", { rotation: 0 }, { rotation: 32, duration: 2.1, ease: "none" }, 0.9);
            tl.fromTo("#s01-stage", { scale: 1 }, { scale: 1.035, duration: 1.8, ease: "sine.inOut" }, 1.2);
            tl.set({}, {}, 3);
            window.__timelines["s01-logo"] = tl;
          };
          K.fontsReady().then(build);
        })();
      </script>
    </template>
  </body>
</html>
