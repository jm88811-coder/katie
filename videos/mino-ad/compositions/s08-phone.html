              <div id="s08-list" class="s08-row">
                <div id="s08-stack">
                  <div class="s08-m u">직장인을 위한 클로드 활용법 릴스</div>
                  <div class="s08-m b">대본·자막·음악 완성했어요 ✓</div>

          <div class="s08-bub u"><span class="s08-who">YOU</span><span class="s08-txt"></span></div>

      <script>
        (function () {
          const K = window.MinoKit;
          const scope = "#s08-phone ";
          const q = (s) => document.querySelector(scope + s);
          const qa = (s) => Array.from(document.querySelectorAll(scope + s));
          q("#s08-sym").innerHTML = K.symbolSVG();

          // Waveform bars: pattern A (calm) blends into pattern B (bright) after "음악 밝게".
          const N = 30;
          const wave = q("#s08-wave");
          for (let i = 0; i < N; i++) wave.appendChild(document.createElement("i"));
          const bars = Array.from(wave.children);
          const A = bars.map((_, i) => 0.25 + 0.2 * Math.abs(Math.sin(i * 1.7)));
          const B = bars.map((_, i) => 0.45 + 0.5 * Math.abs(Math.sin(i * 0.9 + 1)));

          const tl = gsap.timeline({ paused: true });
          const msgs = ["자막 더 크게", "수정했어요 ✓", "음악 밝게", "완료 ✓"];
          const bubbles = qa(".s08-bub");
          const newMsgs = qa(".s08-m.n");
          const stack = q("#s08-stack");

          // Phone rises at an 8° yaw and slowly settles to face front.
          tl.fromTo("#s08-rig", { y: 620 }, { y: 0, duration: 0.6, ease: "power3.out" }, 0);
          tl.fromTo("#s08-body", { transformPerspective: 1800, rotationY: 8, rotationX: 4 }, { rotationY: 0, rotationX: 0, duration: 3.6, ease: "sine.inOut" }, 0.1);
          tl.fromTo("#s08-halo", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 0.1);
          tl.to("#s08-halo", { opacity: 0.7, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.7);

          // Screen wakes, then the app UI draws in top -> bottom, one row at a time.
          tl.to("#s08-off", { opacity: 0, duration: 0.12, ease: "none" }, 0.55);
          tl.fromTo("#s08-flash", { opacity: 0 }, { opacity: 1, duration: 0.06, yoyo: true, repeat: 1, ease: "none" }, 0.55);
          tl.fromTo(".s08-row", { clipPath: "inset(0% 0% 100% 0%)", opacity: 0 }, { clipPath: "inset(0% 0% 0% 0%)", opacity: 1, duration: 0.18, ease: "power2.out", stagger: 0.08 }, 0.65);
          tl.fromTo("#s08-prog i", { scaleX: 0.08 }, { scaleX: 0.72, duration: 3.2, ease: "none" }, 0.8);

          // Constant motion inside the preview: the waveform keeps dancing.
          const w = { t: 0, mix: 0 };
          const paintWave = () => {
            for (let i = 0; i < N; i++) {
              const base = A[i] + (B[i] - A[i]) * w.mix;
              const h = base * (0.55 + 0.45 * Math.abs(Math.sin(w.t * 7 + i * 0.65)));
              bars[i].style.height = (h * 100).toFixed(1) + "%";
              bars[i].style.background = w.mix > 0.5 ? "#C8FF00" : "rgba(244,244,240,0.45)";
              bars[i].style.boxShadow = w.mix > 0.5 ? "0 0 8px rgba(200,255,0,0.8)" : "none";
            }
          };
          paintWave();
          tl.to(w, { t: 4, duration: 4, ease: "none", onUpdate: paintWave }, 0);

          const build = () => {
            // Phone chat list: new messages enter from the bottom and push older ones up.
            const gap = 8;
            const hs = newMsgs.map((m) => m.offsetHeight + gap);
            const rest = (k) => hs.slice(k).reduce((a, b) => a + b, 0);
            gsap.set(stack, { y: rest(0) });
            gsap.set(newMsgs, { opacity: 0 });

            const beats = [1.3, 1.85, 2.45, 3.0];
            beats.forEach((at, k) => {
              const bub = bubbles[k];
              tl.fromTo(bub, { opacity: 0, scale: 0.7, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(2.2)" }, at);
              K.type(tl, bub.querySelector(".s08-txt"), msgs[k], at + 0.05, 20);
              tl.to(stack, { y: rest(k + 1), duration: 0.3, ease: "power3.out" }, at + 0.18);
              tl.fromTo(newMsgs[k], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, at + 0.2);
            });

            // "수정했어요" -> captions grow. "완료" -> music waveform turns bright.
            tl.to("#s08-caption span", { scale: 1.5, duration: 0.35, ease: "back.out(2)" }, 2.1);
            tl.fromTo("#s08-caption span", { boxShadow: "0 0 0 0 rgba(200,255,0,0)" }, { boxShadow: "0 0 0 2px rgba(200,255,0,0.9)", duration: 0.15, yoyo: true, repeat: 1 }, 2.1);
            tl.to(w, { mix: 1, duration: 0.4, ease: "power2.out", onUpdate: paintWave }, 3.2);
            tl.set({}, {}, 4);
            window.__timelines["s08-phone"] = tl;
          };
          document.fonts.ready.then(build);
        })();
      </script>
